name: ozioma
description: Ozioma - Worldwide offline-first field ministry and congregation administration platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  powersync: ^1.7.1
  supabase_flutter: ^2.5.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.1.8
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^12.0.0
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  flutter_tts: ^4.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.1
  build_runner: ^2.4.10
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
